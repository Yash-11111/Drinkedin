<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications – DrinkedIn</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍸</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>

<body>

  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🍸</span>
        <span class="logo-text">Drinked<em>In</em></span>
      </a>
      <div class="nav-search" style="position:relative">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearchInput" placeholder="Search users, drinks, tags…" autocomplete="off"
          oninput="handleGlobalSearch(this.value)" onblur="hideSearchResults()"
          onfocus="if(this.value) handleGlobalSearch(this.value)" />
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link" title="Feed">🏠<span>Feed</span></a>
        <a href="messages.html" class="nav-link" title="Messages">💬<span>Messages</span></a>
        <a href="explore.html" class="nav-link" title="Explore">🌍<span>Explore</span></a>
        <a href="events.html" class="nav-link" title="Events">🎉<span>Events</span></a>
        <a href="notifications.html" class="nav-link active" title="Notifications">
          🔔<span>Alerts</span>
        </a>
        <a href="recommend.html" class="nav-link" title="AI">🤖<span>AI</span></a>
        <a href="profile.html" class="nav-link" title="Profile">
          <img src="https://i.pravatar.cc/36?img=12" class="nav-avatar" alt="Profile" />

        </a>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
        <button class="btn-outline nav-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="notif-layout">

    <div class="notif-container">
      <div class="notif-header">
        <h2>🔔 Notifications</h2>
        <div class="notif-header-actions">
          <button class="btn-outline" onclick="markAllRead()">✓ Mark all read</button>
          <button class="btn-outline del-btn" onclick="clearAll()">🗑️ Clear all</button>
        </div>
      </div>

      <!-- FILTER TABS -->
      <div class="notif-tabs">
        <button class="notif-tab active" onclick="filterNotifs('all', this)">All</button>
        <button class="notif-tab" onclick="filterNotifs('cheer', this)">🥂 Cheers</button>
        <button class="notif-tab" onclick="filterNotifs('follow', this)">🍻 Follows</button>
        <button class="notif-tab" onclick="filterNotifs('comment', this)">💬 Comments</button>
        <button class="notif-tab" onclick="filterNotifs('message', this)">✉️ Messages</button>
      </div>

      <div id="notifList"></div>
    </div>

  </div>

  <div class="toast" id="toast"></div>
  <script src="js/config.js"></script>
  <script src="js/notifications.js"></script>
</body>

</html>
