<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DrinkedIn – Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍸</text></svg>"/>
  <link rel="stylesheet" href="login.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="login-page">

  <!-- ANIMATION SIDE -->
  <div class="login-animation-side">
    <div class="animation-container" id="animContainer">

      <!-- BOTTLE -->
      <div class="bottle-wrap" id="bottleWrap">
        <div class="bottle" id="bottle">
          <div class="bottle-neck"></div>
          <div class="bottle-body">
            <div class="bottle-liquid" id="bottleLiquid"></div>
            <div class="bottle-label">
              <span>DRINKED</span>
              <span>IN</span>
            </div>
          </div>
          <div class="bottle-cap"></div>
        </div>
        <div class="pour-stream" id="pourStream"></div>
      </div>

      <!-- GLASSES CONTAINER -->
      <div class="glasses-container" id="glassesContainer">
        <div class="glass active" id="glass0">
          <div class="glass-body">
            <div class="glass-liquid" id="liquid0"></div>
            <div class="glass-shine"></div>
          </div>
          <div class="glass-stem"></div>
          <div class="glass-base"></div>
        </div>
      </div>

      <!-- BUBBLES -->
      <div class="bubbles-container" id="bubblesContainer"></div>

    </div>

    <div class="animation-text">
      <h2>Every Sip Has a Story</h2>
      <p>Join the world's most spirited network</p>
    </div>
  </div>

  <!-- LOGIN SIDE -->
  <div class="login-card-side">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">🍸</span>
        <h1>Drinked<em>In</em></h1>
      </div>
      <p class="login-sub">Sign in with your email — no password needed</p>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input id="email" type="email" placeholder="your@email.com" autocomplete="email"/>
        <button class="btn-primary send-otp-btn" onclick="sendOTP()">Send OTP →</button>
      </div>

      <div class="form-group" id="otpSection" style="display:none">
        <label class="form-label">Enter OTP</label>
        <p class="otp-hint">Check your email for a 6-digit code</p>
        <div class="otp-input-row">
          <input id="otp" type="text" placeholder="••••••" maxlength="6" inputmode="numeric"/>
          <button class="btn-primary" onclick="verifyOTP()">Login →</button>
        </div>
        <button class="resend-btn" onclick="sendOTP()">Resend OTP</button>
      </div>

      <p id="status" class="status-msg"></p>

      <div class="login-features">
        <div class="feature-item">🔒 <span>No password needed</span></div>
        <div class="feature-item">🍸 <span>Share your pours</span></div>
        <div class="feature-item">🥂 <span>Connect with drinkers</span></div>
        <div class="feature-item">🤖 <span>AI recommendations</span></div>
      </div>
    </div>
  </div>

</div>
<script src="js/config.js"></script>
<script src="auth.js"></script>
<script src="js/pour-animation.js"></script>
</body>
</html>
