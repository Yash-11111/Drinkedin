<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events – DrinkedIn</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍸</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>

<body>

  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🍸</span>
        <span class="logo-text">Drinked<em>In</em></span>
      </a>
      <div class="nav-search" style="position:relative">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearchInput" placeholder="Search users, drinks, tags…" autocomplete="off"
          oninput="handleGlobalSearch(this.value)" onblur="hideSearchResults()"
          onfocus="if(this.value) handleGlobalSearch(this.value)" />
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link" title="Feed">🏠<span>Feed</span></a>
        <a href="explore.html" class="nav-link" title="Explore">🌍<span>Explore</span></a>
        <a href="events.html" class="nav-link active" title="Events">🎉<span>Events</span></a>
        <a href="messages.html" class="nav-link" title="Messages">💬<span>Messages</span></a>
        <a href="notifications.html" class="nav-link" title="Alerts">🔔<span>Alerts</span></a>
        <a href="profile.html" class="nav-link" title="Profile">
          <img src="https://i.pravatar.cc/36?img=12" class="nav-avatar" alt="Profile" />
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
        <button class="btn-outline nav-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <div class="events-hero">
    <div class="events-hero-content">
      <h1>🎉 Events</h1>
      <p>Create parties, send invitations, gather your crew</p>
      <button class="btn-primary" onclick="openCreateEventModal()">+ Create Event</button>
    </div>
  </div>

  <div class="events-layout">

    <!-- TABS -->
    <div class="events-tabs">
      <button class="events-tab active" onclick="switchEventsTab('created', this)">🎪 My Events</button>
      <button class="events-tab" onclick="switchEventsTab('invited', this)">📬 Invitations</button>
    </div>

    <!-- MY EVENTS -->
    <div id="tab-created" class="events-tab-content active">
      <div id="createdEventsList"></div>
    </div>

    <!-- INVITATIONS -->
    <div id="tab-invited" class="events-tab-content">
      <div id="invitedEventsList"></div>
    </div>

  </div>

  <!-- CREATE EVENT MODAL -->
  <div class="modal-overlay" id="createEventModal">
    <div class="modal-card" style="max-width:560px">
      <div class="modal-header">
        <h3>🎉 Create Event</h3>
        <button class="modal-close" onclick="closeCreateEventModal()">✕</button>
      </div>
      <div class="modal-body" style="flex-direction:column; gap:16px; padding:24px;">

        <div class="edit-field-group">
          <label class="modal-label">Event Title *</label>
          <input type="text" id="eventTitle" placeholder="e.g. Whiskey Tasting Night 🥃" />
        </div>

        <div class="edit-field-group">
          <label class="modal-label">Description</label>
          <textarea id="eventDesc" rows="3" placeholder="Tell your guests what to expect…"></textarea>
        </div>

        <div class="edit-field-group">
          <label class="modal-label">📍 Location *</label>
          <input type="text" id="eventLocation" placeholder="e.g. The Copper Still, Mathura" />
        </div>

        <div class="edit-field-group">
          <label class="modal-label">📅 Date & Time *</label>
          <input type="datetime-local" id="eventDate" />
        </div>

        <div class="edit-field-group">
          <label class="modal-label">🍸 Drinks (optional)</label>
          <div class="tag-input-wrap">
            <input type="text" id="drinkTagInput" placeholder="Add a drink and press Enter" />
            <div id="drinkTagsList" class="tags-list"></div>
          </div>
          <div class="popular-tags" style="margin-top:8px">
            <button onclick="addDrinkTag('Whiskey')">🥃 Whiskey</button>
            <button onclick="addDrinkTag('Beer')">🍺 Beer</button>
            <button onclick="addDrinkTag('Wine')">🍷 Wine</button>
            <button onclick="addDrinkTag('Cocktails')">🍹 Cocktails</button>
            <button onclick="addDrinkTag('Champagne')">🍾 Champagne</button>
          </div>
        </div>

        <div class="edit-field-group">
          <label class="modal-label">👥 Invite People</label>
          <input type="text" id="inviteeSearch" placeholder="Search users to invite…"
            oninput="searchInvitees(this.value)" />
          <div id="inviteeSearchResults" class="user-search-results" style="max-height:160px"></div>
          <div id="inviteesList" class="invitees-selected"></div>
        </div>

        <div class="edit-field-group">
          <label class="modal-label" style="flex-direction:row;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="eventPublic" style="width:16px;height:16px;accent-color:var(--yellow)" />
            Make this event public (visible to all users)
          </label>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closeCreateEventModal()">Cancel</button>
        <button class="btn-primary" id="createEventBtn" onclick="submitNewEvent()">Send Invitations 🎉</button>
      </div>
    </div>
  </div>

  <!-- EVENT DETAIL MODAL -->
  <div class="modal-overlay" id="eventDetailModal">
    <div class="modal-card" style="max-width:500px" id="eventDetailContent"></div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/config.js"></script>
  <script src="js/events.js"></script>
</body>

</html>
